version: "3.9"

networks:
  pe-net:
    driver: bridge

volumes:
  pg_data:
  es_data:
  redis_data:

services:
  # ── Applications ─────────────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pe:pe@postgres:5432/user_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: development
    depends_on: [postgres, redis, kafka]
    networks: [pe-net]
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports: ["8000:8000"]
    environment:
      USER_SERVICE_URL: http://user-service:8000
      DATA_SERVICE_URL: http://data-service:8000
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: development
    depends_on: [user-service]
    networks: [pe-net]
    restart: unless-stopped

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    command: celery -A worker_service.infrastructure.celery_app:app worker -l info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://pe:pe@postgres:5432/worker_db
      REDIS_URL: redis://redis:6379/2
      KAFKA_BROKERS: kafka:9092
      ENVIRONMENT: development
    depends_on: [postgres, redis, kafka]
    networks: [pe-net]
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    command: celery -A worker_service.infrastructure.celery_app:app beat -l info
    environment:
      REDIS_URL: redis://redis:6379/2
      ENVIRONMENT: development
    depends_on: [redis]
    networks: [pe-net]
    restart: unless-stopped

  data-service:
    build:
      context: .
      dockerfile: apps/data-service/Dockerfile
    ports: ["8002:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pe:pe@postgres:5432/data_db
      REDIS_URL: redis://redis:6379/3
      KAFKA_BROKERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENVIRONMENT: development
    depends_on: [postgres, redis, kafka, elasticsearch]
    networks: [pe-net]
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pe
      POSTGRES_PASSWORD: pe
      POSTGRES_MULTIPLE_DATABASES: "user_db,worker_db,data_db"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports: ["5432:5432"]
    networks: [pe-net]

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [pe-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [pe-net]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [pe-net]

  elasticsearch:
    image: elasticsearch:8.16.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [es_data:/usr/share/elasticsearch/data]
    ports: ["9200:9200"]
    networks: [pe-net]

  kibana:
    image: kibana:8.16.0
    depends_on: [elasticsearch]
    ports: ["5601:5601"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks: [pe-net]
