app:
  name: user-service
  version: "1.0.0"
  env: dev  # dev | test | staging | prod

http:
  host: 0.0.0.0
  port: 8080
  read_timeout_sec: 30
  write_timeout_sec: 30

grpc:
  host: 0.0.0.0
  port: 9090

database:
  driver: mysql
  # 生产环境通过环境变量覆盖：DATABASE_DSN
  dsn: "root:password@tcp(localhost:3306)/users?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 300

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

log:
  level: debug    # debug | info | warn | error
  format: text    # json | text
  output: stdout  # stdout | file

tracing:
  enabled: false
  endpoint: "http://jaeger:4318"
  service_name: user-service
  sample_rate: 0.1
