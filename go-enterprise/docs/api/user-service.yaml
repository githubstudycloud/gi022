openapi: 3.1.0
info:
  title: User Service API
  version: "1.0.0"
  description: |
    用户服务 REST API。所有接口返回统一响应结构。

    **通用响应格式**：
    ```json
    { "code": 0, "message": "success", "data": {}, "trace_id": "xxx" }
    ```

    **错误码说明**：
    - 0: 成功
    - 1001: 参数错误
    - 1002: 未授权
    - 1004: 资源不存在
    - 1005: 冲突（如邮箱已存在）
    - 5000: 服务内部错误

servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://api.example.com
    description: 生产环境

tags:
  - name: users
    description: 用户管理

paths:
  /api/v1/users:
    post:
      tags: [users]
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: alice
              email: alice@example.com
              password: "Passw0rd!"
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [users]
      summary: 用户列表
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          schema:
            type: string
          description: 按用户名/邮箱模糊搜索
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserList'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [users]
      summary: 获取用户详情
      operationId: getUser
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [users]
      summary: 更新用户
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [users]
      summary: 删除用户
      operationId: deleteUser
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Response:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务错误码，0 表示成功
          example: 0
        message:
          type: string
          example: success
        data:
          description: 业务数据
        trace_id:
          type: string
          description: 链路追踪 ID

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserStatus:
      type: integer
      enum: [1, 0, -1]
      description: "1: 活跃, 0: 未激活, -1: 封禁"

    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pages:
          type: integer

    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        trace_id:
          type: string

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1001
            message: "invalid parameter"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1004
            message: "resource not found"
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1005
            message: "email already registered"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
