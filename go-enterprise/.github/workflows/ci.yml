name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"

jobs:
  # ── 检测变更范围 ───────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      libs: ${{ steps.filter.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            services:
              - 'apps/**'
            libs:
              - 'libs/**'

  # ── 代码静态检查 ───────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── 安全扫描 ──────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: |
          for dir in libs/*/; do
            echo "Scanning $dir..."
            cd "$dir" && govulncheck ./... && cd -
          done
          for dir in apps/*/; do
            echo "Scanning $dir..."
            cd "$dir" && govulncheck ./... && cd -
          done

  # ── 单元测试（并行跑各模块）──────────────────────────────────────────────
  test-libs:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        lib: [config, logger, db, cache, errors, tracing, middleware, eventbus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test ${{ matrix.lib }}
        run: |
          cd libs/${{ matrix.lib }}
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: libs/${{ matrix.lib }}/coverage.out
          flags: lib-${{ matrix.lib }}

  test-services:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        service: [user-service, order-service, api-gateway]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      redis:
        image: redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test ${{ matrix.service }}
        env:
          TEST_DSN: "root:password@tcp(localhost:3306)/testdb?parseTime=True"
          TEST_REDIS_ADDR: "localhost:6379"
        run: |
          cd apps/${{ matrix.service }}
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/${{ matrix.service }}/coverage.out
          flags: service-${{ matrix.service }}

  # ── Docker Build 验证 ─────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test-libs, test-services]
    strategy:
      matrix:
        service: [user-service, order-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: go-enterprise/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
